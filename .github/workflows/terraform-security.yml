name: 'Terraform Security Scan'

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 0'  # Run weekly on Sundays

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  security:
    name: 'Security Scan'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Run tfsec
      uses: aquasecurity/tfsec-action@v1.0.0
      with:
        working_directory: ${{ github.workspace }}
        format: sarif
        output_file: ${{ github.workspace }}/tfsec-results.sarif
        soft_fail: true

    - name: Upload tfsec results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: ${{ github.workspace }}/tfsec-results.sarif
        category: tfsec

    - name: Run Checkov
      uses: bridgecrewio/checkov-action@master
      with:
        directory: ${{ github.workspace }}
        framework: terraform
        output_format: sarif
        output_file: ${{ github.workspace }}/checkov-results.sarif
        soft_fail: true

    - name: Upload Checkov results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: ${{ github.workspace }}/checkov-results.sarif
        category: checkov 